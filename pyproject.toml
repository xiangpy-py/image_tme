[project]
name = "image-tme"
version = "0.1.0"
description = "人智算法大赛：基于虚拟染色的免疫组化图像生成"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

# 本项目是「应用」而非「可安装库」：不构建/安装自身，依赖统一交给 uv 管理。
[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.mirrors.ustc.edu.cn/simple/"
default = true
