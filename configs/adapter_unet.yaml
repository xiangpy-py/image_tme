# 实验 007：共享编码器 + 标记适配器
# 目标：共享结构表示 + 标记专用适配，配合跨标记一致性损失。

experiment:
  name: exp007_adapter_unet

data:
  root: data              # 数据根目录，兼容 data/train 与 data/<organ>/train
  split_dir: data/splits  # ROI 划分目录，先执行: uv run main.py split
  num_workers: 8          # 数据加载进程数，留空按 CPU 核心数自动探测
  cache: true             # 内存缓存解码图像，免去每 epoch 重复解码 JPG

model:
  type: adapter_unet      # 可选值见 src/train/models.py 的 ModelRegistry
  in_channels: 3
  out_channels: 1
  base_channels: 64
  depth: 4
  num_markers: 4          # CD68 / CD45RO / HLA-DR / Vimentin
  return_shared: true     # 返回瓶颈共享特征，供 CrossMarker 损失使用

loss:
  lambda_l1: 1.0
  lambda_ssim: 1.0
  lambda_edge: 0.5        # 边缘损失，约束细胞/组织边界结构
  lambda_cross: 0.1       # 跨标记一致性，仅 return_shared 时生效
  edge_kernel_size: 3

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.5
  rotate90: true
  brightness: 0.1
  contrast: 0.1
  noise_std: 0.01

training:
  epochs: 150
  batch_size: 32
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  ema: true               # 权重滑动平均
  ema_eval_every: 5       # EMA 权重每 5 轮评估一次，降低验证开销
  amp: true               # 混合精度，仅 CUDA 生效
  compile: false          # torch.compile 图优化，仅 CUDA 生效

inference:
  output_dir: results
  suffix: _fake

runtime:
  device: auto            # auto / cpu / cuda / cuda:0
  seed: 42
  deterministic: false    # false 启用 cuDNN 自动调优，训练更快
