# Experiment 007: Shared Encoder + Marker Adapter
# 目标：共享结构表示 + 标记专用适配，配合 Cross-Marker Consistency

experiment:
  name: exp007_adapter_unet

data:
  root: data
  split_dir: data/splits
  num_workers: 8
  cache: true             # 全部图像预加载到内存，免去每 epoch 重复解码 JPG

model:
  type: adapter_unet
  in_channels: 3
  out_channels: 1
  base_channels: 64
  depth: 4
  num_markers: 4
  return_shared: true      # 暴露瓶颈共享特征，供 CrossMarker 损失使用

loss:
  lambda_l1: 1.0
  lambda_ssim: 1.0
  lambda_edge: 0.5
  lambda_perceptual: 0.0
  lambda_cross: 0.1        # 跨标记一致性约束（共享特征独立于标记类型）
  edge_kernel_size: 3

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.5
  rotate90: true
  brightness: 0.1
  contrast: 0.1
  noise_std: 0.01

training:
  epochs: 150
  batch_size: 32
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  ema: true
  ema_eval_every: 5     # EMA 权重每 5 轮才额外评估一次，降低验证开销
  amp: true
  compile: false          # torch.compile 图优化（仅 CUDA 生效）

inference:
  output_dir: results
  suffix: _fake

runtime:
  device: auto
  deterministic: false  # 关闭确定性卷积，启用 cuDNN 自动调优
  seed: 42
