# Experiment 003: CNN + Transformer 瓶颈
# 目标：在 U 型结构瓶颈处引入自注意力，建模长距离组织与细胞空间关系。

experiment:
  name: exp003_trans_unet

data:
  root: data
  marker: CD68
  split_dir: data/splits
  num_workers: 8
  cache: true             # 全部图像预加载到内存，免去每 epoch 重复解码 JPG

model:
  type: trans_unet
  in_channels: 3
  out_channels: 1
  base_channels: 64
  depth: 4
  transformer_layers: 4
  num_heads: 8
  mlp_ratio: 4.0

loss:
  lambda_l1: 1.0
  lambda_ssim: 1.0
  lambda_perceptual: 0.0    # 显存充足时可开启，如 0.05

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.5
  rotate90: true
  brightness: 0.1
  contrast: 0.1
  noise_std: 0.01

training:
  epochs: 100
  batch_size: 8             # Transformer 瓶颈显存开销较大，适当减小 batch
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  amp: true              # 混合精度训练
  compile: true          # torch.compile 图优化（仅 CUDA 生效）

inference:
  output_dir: results
  suffix: _fake

runtime:
  device: auto
  deterministic: false  # 关闭确定性卷积，启用 cuDNN 自动调优
  seed: 42
