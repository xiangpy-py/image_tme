# 实验 009：多尺度上下文输入 U-Net
# 思路（Global Pixel Transformers 论文）：以 patch 中心为锚取 2× 视野
# 邻域（512×512 下采样到 256）作为上下文通道，与 DAPI 拼接输入——
# IHC 表达与组织结构区域强相关，单 256 视野不足以判断所处结构。
#
# 前置：uv run main.py context --root data --output data/context --scale 2
# （数据集或倍率变动后需重新生成）

experiment:
  name: exp009_unet_context

data:
  root: data
  marker: CD68
  split_dir: data/splits
  num_workers: 12
  cache: true
  context_dir: data/context  # 非空即启用多尺度上下文输入（6 通道）

model:
  type: unet
  in_channels: 6            # 3(DAPI) + 3(上下文)，模型其余部分无需改动
  out_channels: 1
  base_channels: 64
  depth: 4

loss:
  lambda_l1: 1.0
  lambda_mse: 1.0           # PSNR 直接代理
  lambda_ssim: 1.0

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.5
  rotate90: true
  brightness: 0.1
  contrast: 0.1
  noise_std: 0.01

training:
  epochs: 100
  batch_size: 64
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  amp: true
  compile: true

inference:
  output_dir: results
  suffix: _fake
  tta: true

runtime:
  device: auto
  seed: 42
  deterministic: false
